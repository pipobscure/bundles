# Publishes to npm whenever main carries a version npm does not have yet.
#
# Bumping `version` in package.json and pushing it is the whole release
# procedure. This runs once CI has passed on a push to main — the commit it
# releases is the one CI tested — and every push whose version is already
# published stops after one `npm view`.
#
# Why after CI rather than on the push itself: the audit step's action accepts
# `workflow_run` and `workflow_dispatch` but not `push`. Waiting for CI is the
# better order anyway, and the job's OIDC identity is unchanged by it: still
# this file, at refs/heads/main.
#
# A release goes through the four steps this project says a bundle is built in,
# with the audit as a real gate:
#
#   1. test          everything must pass before anything is packaged
#   2. create        the unsigned CLI bundle
#   3. baseline      fetch the published bundle, and verify it
#      audit         review the new one *against* it; a JSON verdict, pinned to bytes
#      gate          refuse to go on without a clean verdict over exactly those bytes
#   4. sign          sigstore, with this workflow's own OIDC identity
#      publish       npm trusted publishing, from the same identity
#   5. github        a GitHub release carrying the signed bundle.nzip, marked
#                    latest — the CLI for anyone with node and nothing else
#
# There is no npm token. npm trusts this workflow file by name, configured on
# the package's npm settings page (Trusted Publisher: GitHub Actions,
# pipobscure/bundles, workflow `publish.yml`), and the job's OIDC token is the
# credential. The same token is what Fulcio certifies the signature with, so
# the bytes inside the package and the package itself are attested by one
# identity. Provenance comes with trusted publishing.
#
# The audit authenticates to Anthropic the same way: workload identity
# federation exchanges the job's GitHub OIDC token for API access, so there is
# no API key either. It needs three repository variables, none of them secret:
#
#   ANTHROPIC_ORGANIZATION_ID     the organization's UUID
#   ANTHROPIC_FEDERATION_RULE_ID  the federation rule (fdrl_...) that trusts
#                                 issuer https://token.actions.githubusercontent.com,
#                                 subject repo:pipobscure/bundles:ref:refs/heads/main
#   ANTHROPIC_SERVICE_ACCOUNT_ID  the service account (svac_...) the rule acts as
#
# Settings → Workload identity → Connect workload → GitHub Actions creates the
# issuer, the service account and the rule together.
#
# and BUNDLE_MAINTAINER_IDENTITY, the sigstore identity hand-signed releases
# carry (see the baseline step).
#
# Every action is pinned to a full commit SHA rather than a tag. A tag is a
# mutable pointer: whoever can move `v1` can change what runs inside a job that
# holds an OIDC token able to sign and publish releases. That is the supply-chain
# attack this whole project is about.

name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  # The identity a release carries, and the one a consumer pins.
  RELEASE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish.yml@refs/heads/main
  RELEASE_ISSUER: https://token.actions.githubusercontent.com

jobs:
  check:
    name: Is this version published?
    # Only after a green CI run for a push to main — not a pull request's run,
    # and not a failed one. A manual dispatch releases the tip of main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit CI tested, not whatever main points at by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'

      # `npm view` exits non-zero for a package that does not exist at all and
      # prints nothing for a version that does not; both mean "publish".
      - name: Compare package.json with the registry
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "::notice::$name@$version is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$name@$version is not published yet; releasing it"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Fulcio takes the signing identity from this token, npm trusted
      # publishing authenticates with it, and so does the audit's access to
      # Anthropic. Nothing else holds a credential.
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit CI tested, not whatever main points at by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'
          registry-url: https://registry.npmjs.org

      # `npm install` rather than `npm ci`: package-lock.json is not committed.
      - name: Install dependencies
        run: npm install

      # ---- 1. nothing gets packaged that does not pass ------------------------
      - name: Build, typecheck and test
        run: npm test

      # ---- 2. the unsigned bundle ---------------------------------------------
      - name: Manifest — observe what the CLI reads, and close over it
        run: npm run manifest:cli

      - name: Pack — the unsigned bundle
        run: npm run pack:cli

      # ---- 3. baseline, audit, gate -------------------------------------------
      # The published release becomes the comparison basis, verified before it is
      # used: a baseline that cannot be placed would make the diff lie by
      # omission. It must be signed by this workflow, or by the maintainer who
      # signed the releases published by hand before it existed.
      - name: Baseline — the release that is already out there
        run: |
          npm run trust
          node --no-warnings --experimental-vfs tools/baseline.ts \
            --identity "$RELEASE_IDENTITY" \
            --identity "${{ vars.BUNDLE_MAINTAINER_IDENTITY }}" \
            --allow-missing

      # Installed by the tool itself, so CI uses the same skill a contributor would.
      - name: Install the audit skill
        run: node --no-warnings dist/main.js skill

      # What the federation rule is matched against: the claims of the OIDC token
      # GitHub mints for this job, with the audience the audit requests. Only the
      # decoded payload is printed — never the token, which is a credential.
      - name: Show the identity the audit will present
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value)
          TOKEN="$token" node -e '
            const c = JSON.parse(Buffer.from(process.env.TOKEN.split(".")[1], "base64url"));
            const { iss, aud, sub, repository, repository_owner, ref, event_name, job_workflow_ref } = c;
            console.log(JSON.stringify({ iss, aud, sub, repository, repository_owner, ref, event_name, job_workflow_ref }, null, 2));'

      - name: Audit — review the difference before signing
        id: audit
        uses: anthropics/claude-code-action@833fb0f8c9f6686b33d963a8bae0a94f4936ab2a # v1
        env:
          BUNDLE_AUDIT_VERDICT: build/cli.audit.json
        with:
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          # The non-human identity the rule lets this job act as.
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          # Only needed when the rule covers more than one workspace.
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # The job's own read-only token: the audit writes nothing to GitHub,
          # and this spares the action a token from the Claude GitHub App.
          github_token: ${{ github.token }}
          prompt: >-
            /audit-bundle build/cli.bundle against build/baseline.bundle

            This is a pre-signing audit. build/cli.bundle is the unsigned bundle this
            workflow just built for ${{ github.repository }} and is about to sign;
            build/baseline.bundle is the currently published release, already verified
            as genuinely signed. If the baseline file is absent, review every member
            instead and say so.

            Use diff mode: review what changed, and call out every member added or
            removed even when each individual diff looks harmless. Write the
            machine-readable verdict to build/cli.audit.json, including baselineSha256
            when you reviewed a diff. The build gates on that file and will not sign
            without a pass pinned to this archive's sha256.
          claude_args: |
            --max-turns 120
            --allowedTools "Bash,Read,Glob,Grep,Write"

      # Kept whether the gate passes or not, so a refused release leaves its
      # reasoning behind rather than only a red X.
      - name: Keep the verdict with the run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-verdict
          path: build/cli.audit.json
          if-no-files-found: warn

      # The auditor's own transcript: what it read, what it concluded, and — when
      # it fails — the error, which the step log reduces to "is_error:true".
      - name: Keep the audit transcript with the run
        if: always() && steps.audit.outputs.execution_file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-transcript
          path: ${{ steps.audit.outputs.execution_file }}
          if-no-files-found: warn

      # ---- 4. sign, and publish -----------------------------------------------
      # sign:cli gates on the verdict itself before it signs. No --key: sigstore
      # takes the identity from the ambient OIDC token, so the release is signed
      # as this workflow rather than as a person.
      - name: Gate on the audit, then sign — sigstore, as this workflow
        run: npm run sign:cli

      - name: Verify what was just signed
        run: |
          node --no-warnings dist/main.js verify \
            --identity "$RELEASE_IDENTITY" --issuer "$RELEASE_ISSUER" bundle.nzip

      - name: Keep the artifacts with the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle
          path: |
            bundle.nzip
            build/cli.manifest
            build/cli.audit.json

      # prepublishOnly refuses a package whose signed CLI is missing, unsigned,
      # or stale relative to this tree. Trusted publishing needs npm 11.5.1 or
      # later; node 26.10.0 ships with one.
      # --loglevel verbose shows the trusted-publishing exchange (npm redacts
      # tokens), which is the only place a refused publish says why: the
      # registry itself answers an unauthorized PUT with a bare 404.
      - name: Publish to npm
        run: |
          npm --version
          npm publish --access public --loglevel verbose

  # A GitHub release for every npm release, carrying the same signed bundle.nzip
  # byte for byte, so the CLI can be had with node alone — no npm, no install.
  #
  # Its own job, because it is the only one that can write to the repository:
  # the job that ran the audit (an agent with a shell) and holds the signing
  # token never gets contents: write, and this one never gets id-token.
  github-release:
    name: GitHub release
    needs: [check, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch what the release job signed and published
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle

      - name: Create the release, marked latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          chmod +x bundle.nzip
          # `bundle.run` was this asset's name up to 0.0.5, and an install made
          # by that version refetches exactly that URL. The same bytes go out
          # under both names so a copy already in the world can still update
          # itself; the `.run` name goes away once nothing asks for it.
          cp bundle.nzip bundle.run
          cat > notes.md <<EOF
          \`@pipobscure/bundle\` $VERSION — the same release as [npm](https://www.npmjs.com/package/@pipobscure/bundle/v/$VERSION).

          **\`bundle.nzip\`** is the whole CLI in one signed file. It needs Node 26.10 or later and nothing else:

          \`\`\`sh
          chmod +x bundle.nzip
          ./bundle.nzip --help
          \`\`\`

          It was signed through sigstore by this repository's publish workflow. Running it does not check it; to check it with a copy you already trust:

          \`\`\`sh
          bundle verify \\
            --identity '$RELEASE_IDENTITY' \\
            --issuer '$RELEASE_ISSUER' \\
            bundle.nzip
          \`\`\`

          \`cli.audit.json\` is the audit verdict it was signed under, pinned to the unsigned archive's sha256.
          EOF
          cp build/cli.audit.json cli.audit.json
          gh release create "v$VERSION" bundle.nzip bundle.run cli.audit.json \
            --target "$TARGET" --title "v$VERSION" --notes-file notes.md --latest

