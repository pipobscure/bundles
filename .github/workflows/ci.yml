# Build, typecheck and test, on every push to main and every pull request.
#
# It tests exactly the floor package.json promises: `engines` says
# node >=26.10.0, so 26.10.0 itself is what runs — that is what stops a newer
# API creeping in unnoticed. A pinned version, so a red run means this
# repository changed, never that a release moved underneath it.
#
# Linux and Windows in parallel, because the two differ in ways this package
# cares about: a `#!` launcher is a unix mechanism, and what replaces it there
# is a file association and PATHEXT. The publish workflow hangs off this one
# completing successfully, so nothing is released until both have passed.
#
# The executable tests need a node whose --build-sea understands "vfsArchive"
# (nodejs/node#65810). On one that does not, they skip themselves and say why
# rather than fail, and they start running on the first node that has it.
#
# Every action is pinned to a full commit SHA, as in the release workflow: a
# tag is a mutable pointer, and this project is about not trusting those.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: 'linux · node 26.10.0' }
          - { os: windows-latest, name: 'windows · node 26.10.0' }
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'

      # The test PKI is minted with openssl, which node has no equivalent of —
      # it can verify certificates but not issue them. Git for Windows ships
      # one; the runner just does not have it on PATH.
      - name: Put openssl on PATH (windows)
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH

      # `npm install` rather than `npm ci`: package-lock.json is not committed,
      # and `npm ci` refuses to run without one.
      - name: Install dependencies
        run: npm install

      # Builds, typechecks and runs the suite — the same command as locally.
      # Each platform's launcher tests skip on the other: a `#!` prefix is a
      # unix mechanism, a `.nzip` association is a Windows one, and the suite
      # says which it skipped and why.
      - name: Test
        run: npm test

